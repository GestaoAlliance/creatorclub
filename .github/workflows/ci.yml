name: CI

# Roda a cada push na main e em todo pull request. Tudo precisa passar antes de publicar.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, testes, migração e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Espelho oficial da imagem do Docker Hub na AWS: o Docker Hub limita downloads sem login e derrubou o CI.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creator_club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creator_club_test

    steps:
      # Actions fixadas pelo hash do commit (tag v5), para uma tag movida não mudar o que roda aqui.
      - name: Baixar o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (gera o cliente Prisma)
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes de integração (Postgres real)
        run: npm run test:integration

      - name: Migração bate com o schema (sem divergência)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creator_club_test?schema=ci_drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Build de produção
        run: npm run build
