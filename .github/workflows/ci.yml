name: CI

# Roda a cada push na main e em todo pull request. Tudo precisa passar antes de publicar.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, testes, migração e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creator_club_test

    steps:
      # Actions fixadas pelo hash do commit (tag v5), para uma tag movida não mudar o que roda aqui.
      - name: Baixar o código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Postgres já instalado na máquina do GitHub (sem baixar imagem): os espelhos do Docker Hub limitavam os downloads e
      # derrubavam o CI antes de qualquer teste.
      - name: Postgres da máquina
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb creator_club_test
          psql "$TEST_DATABASE_URL" -tAc "SELECT version()"

      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (gera o cliente Prisma)
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes de integração (Postgres real)
        run: npm run test:integration

      - name: Migração bate com o schema (sem divergência)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creator_club_test?schema=ci_drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Build de produção
        run: npm run build
